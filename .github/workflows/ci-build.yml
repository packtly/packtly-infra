name: ci-build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:


jobs:
  build-collection:
    runs-on: ubuntu-24.04
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: ./scripts/install-requirements
      
      - name: Install ansible
        run: ./scripts/install-ansible

      - name: Get release version
        id: context
        uses: ./.github/actions/get-version

      - name: Lint
        run: ./scripts/ansible-lint

      - name: SARIF
        run: ./scripts/ansible-lint --github-format
        if: always()

      - name: Lint output (pep8)
        run: ./scripts/ansible-lint --reviewdog
        if: always()

      - name: Install reviewdog
        if: always()
        uses: reviewdog/action-setup@v1

      - name: Reviewdog
        if: always()
        run: |
          reviewdog \
            -f=pep8 \
            -name="ansible-lint" \
            -reporter=github-pr-check \
            -level=error \
            < scripts/ansible-lint.out
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF results
        if: >-
          always() &&
          !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scripts/ansible-lint.sarif
          category: ansible-lint

      - name: Update version in README
        run: |
          VERSION="${{ steps.context.outputs.release_version }}"
          sed -i \
            "s/^version:.*/version: ${VERSION}/" \
            ansible/galaxy.yml

      - name: Build collection
        run: |
          ./scripts/ansible-build

      - name: Upload collection artifact
        uses: actions/upload-artifact@v7
        with:
          name: packtly-infra-collection
          path: "ansible/*.tar.gz"

  build-container:
    runs-on: ubuntu-24.04
    permissions: 
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare build environment
        uses: ./.github/actions/setup-podman

      - name: Get release version
        id: context
        uses: ./.github/actions/get-version

      - name: Version
        run: echo "Release version is ${{ steps.context.outputs.release_version }}"

      - name: Build image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ github.repository }}
          tags: latest
          containerfiles: packtly-infra/Containerfile
          context: packtly-infra
          build-args: VERSION=${{ steps.context.outputs.release_version }}
          oci: true

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: latest
          registry: ghcr.io
