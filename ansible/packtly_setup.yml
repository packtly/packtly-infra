---
- name: Bootstrap packtly host
  hosts: all
  gather_facts: false
  remote_user: "{{ bootstrap_user | default(omit) }}"
  become: true

  pre_tasks:
    - name: Require explicit --limit to prevent accidental full deployment
      ansible.builtin.assert:
        that: ansible_limit is defined and ansible_limit | length > 0
        fail_msg: "You must specify a target with --limit <group-or-host>"

  tasks:
    - name: Install container runtime
      ansible.builtin.import_role:
        name: container_runtime

    - name: Configure packtly secrets
      ansible.builtin.import_role:
        name: packtly_secrets

    - name: Create packtly service user
      ansible.builtin.import_role:
        name: packtly_service
        tasks_from: user

- name: Deploy packtly service
  hosts: all
  gather_facts: false
  remote_user: "{{ service_user | default(omit) }}"
  become: "{{ (ansible_connection == 'local') | bool }}"
  become_user: "{{ service_user }}"

  tasks:
    - name: Deploy packtly service
      ansible.builtin.import_role:
        name: packtly_service
        tasks_from: deploy

    - name: Configure SSH client access
      ansible.builtin.import_role:
        name: sshconfig
