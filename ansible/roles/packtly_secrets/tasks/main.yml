---
- block:
  - name: Pull container image if selected
    include_tasks: image_pull.yml
    when: container_method == 'pull'

  - name: Build container image if selected
    include_tasks: image_build.yml
    when: container_method == 'build'

  - name: Create Podman secret for Aptly
    include_tasks: create_secrets.yml

  delegate_to: localhost
  become: false