- name: Create Podman network packtlynet
  containers.podman.podman_network:
    name: packtlynet
    state: present
    driver: bridge
    subnet: 10.100.0.0/24
    gateway: 10.100.0.1

- name: Ensure Quadlet directory exists
  ansible.builtin.file:
    path: "~/.config/containers/systemd"
    state: directory
    mode: "0755"

- name: Deploy Quadlet container unit
  ansible.builtin.template:
    src: packtly.container.j2
    dest: "~/.config/containers/systemd/{{ container_name }}.container"
    mode: "0644"

