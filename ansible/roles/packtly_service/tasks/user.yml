---
- name: Create service user
  ansible.builtin.user:
    name: "{{ service_user }}"
    comment: "packtly service user"
    shell: /bin/bash
    create_home: true
    password: "{{ service_user_password if (service_user_password is defined and service_user_password) else omit }}"
    update_password: "{{ 'always' if (service_user_password is defined and service_user_password) else omit }}"
    state: present

- name: Get service user UID
  ansible.builtin.getent:
    database: passwd
    key: "{{ service_user }}"
  register: packtly_service_service_user_info

- name: Set service user UID fact
  ansible.builtin.set_fact:
    packtly_service_service_user_uid: >-
      {{
        packtly_service_service_user_info
        .ansible_facts
        .getent_passwd[service_user][1]
      }}

- name: Check if lingering is enabled
  ansible.builtin.command: loginctl show-user {{ service_user }} -p Linger
  register: packtly_service_linger_check
  failed_when: false
  changed_when: false

- name: Enable lingering if needed
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ service_user }}
  changed_when: "'Linger=yes' not in packtly_service_linger_check.stdout"
  when: "'Linger=yes' not in packtly_service_linger_check.stdout"

- name: Ensure user systemd instance is running
  ansible.builtin.systemd:
    name: "user@{{ packtly_service_service_user_uid }}.service"
    state: started
    scope: system

- name: Wait for user bus socket to be available
  ansible.builtin.wait_for:
    path: "/run/user/{{ packtly_service_service_user_uid }}/bus"
    timeout: 30

- name: Authorize deploy key for service user
  ansible.posix.authorized_key:
    user: "{{ service_user }}"
    state: present
    key: "{{ lookup('file', deploy_ssh_pubkey_file | default(lookup('env', 'HOME') + '/.ssh/id_ed25519.pub')) }}"
  when: ansible_connection != 'local'
