---
- name: Set current user and home directory
  ansible.builtin.set_fact:
    current_user: "{{ lookup('env', 'USER') }}"
    home_dir: "{{ lookup('env', 'HOME') }}"
  delegate_to: localhost
  become: false

- ansible.builtin.debug:
    msg: "Configuring SSH for user '{{ current_user }}', home: {{ home_dir }}"
  delegate_to: localhost
  become: false

- name: Set SSH paths
  ansible.builtin.set_fact:
    ssh_dir: "{{ home_dir }}/.ssh"
    ssh_config_d: "{{ home_dir }}/.ssh/config.d"
  delegate_to: localhost
  become: false

- name: Ensure ~/.ssh and config.d directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ current_user }}"
  loop:
    - "{{ ssh_dir }}"
    - "{{ ssh_config_d }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure ~/.ssh/config includes config.d/*
  ansible.builtin.lineinfile:
    path: "{{ ssh_dir }}/config"
    line: "Include config.d/*"
    create: true
    insertafter: BOF
    owner: "{{ current_user }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

- name: packtly ssh config
  ansible.builtin.template:
    src: packtly.j2
    dest: "{{ ssh_config_d }}/packtly-{{ inventory_hostname }}"
    mode: "0600"
  delegate_to: localhost
  become: false
