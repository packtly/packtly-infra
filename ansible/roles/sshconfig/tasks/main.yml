---
- name: Set current user and home directory
  ansible.builtin.set_fact:
    sshconfig_current_user: "{{ lookup('env', 'USER') }}"
    sshconfig_home_dir: "{{ lookup('env', 'HOME') }}"
  delegate_to: localhost
  become: false

- name: Show SSH configuration target user
  ansible.builtin.debug:
    msg: "Configuring SSH for user '{{ sshconfig_current_user }}', home: {{ sshconfig_home_dir }}"
  delegate_to: localhost
  become: false

- name: Set SSH paths
  ansible.builtin.set_fact:
    sshconfig_ssh_dir: "{{ sshconfig_home_dir }}/.ssh"
    sshconfig_ssh_config_d: "{{ sshconfig_home_dir }}/.ssh/config.d"
  delegate_to: localhost
  become: false

- name: Ensure ~/.ssh and config.d directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
    owner: "{{ sshconfig_current_user }}"
  loop:
    - "{{ sshconfig_ssh_dir }}"
    - "{{ sshconfig_ssh_config_d }}"
  delegate_to: localhost
  become: false
  run_once: true

- name: Ensure ~/.ssh/config includes config.d/*
  ansible.builtin.lineinfile:
    path: "{{ sshconfig_ssh_dir }}/config"
    line: "Include config.d/*"
    create: true
    insertafter: BOF
    owner: "{{ sshconfig_current_user }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true

- name: Packtly ssh config
  ansible.builtin.template:
    src: packtly.j2
    dest: "{{ sshconfig_ssh_config_d }}/packtly-{{ inventory_hostname }}"
    mode: "0600"
  delegate_to: localhost
  become: false
